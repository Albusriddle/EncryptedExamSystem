name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR/push 检查全部在 Linux 上跑：Windows runner 计费更高，能省则省。
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # client 引入了 eframe → winit/glutin，Linux 上需要 X11/Wayland 开发头文件。
      # 即使上游用的是 dlopen 加载方式、实际不链接这些库，装上也无害（约 5 秒），
      # 能消除"CI 因缺系统库变红"的不确定性。
      - name: 安装 Linux GUI 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（含黄金向量：确定性抽题跨平台一致性）
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Qt 的无头运行需要这些系统库：缺 libEGL/libGL 时 QApplication 直接
      # 报 "could not load the Qt platform plugin xcb"。
      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: lint + test
        working-directory: admin
        # uv 会按 pyproject.toml 的 requires-python 自动挑选解释器，
        # 不需要额外的 setup-python。
        #
        # 装 --extra gui 并设 QT_QPA_PLATFORM=offscreen：UI 测试**真的跑**，
        # 不再 importorskip 跳过。本项目最严重的几个 bug（勾选丢失、
        # 保存后科目清空）都只在界面层暴露，跳过等于没测。
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked --extra gui
          uv run ruff check .
          uv run pytest -q

  # 发布预检：复现 release.yml 的关键假设。
  #
  # 为什么需要单独一个 job：release 曾经有三处只有真实发布环境才暴露的问题
  # （产物在 target/<triple>/release、onefile 需要可写 TEMP、脚本输出编码）。
  # 这里用 --target 构建，专门覆盖"CI 布局与产物定位"这一段，
  # 让回归在 PR 阶段就被发现，而不是打 tag 之后。
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux GUI 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: 按 release 的方式构建（带 --target）
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu
      - name: 发布预检
        run: bash scripts/preflight-release.sh

  # 管理端打包：PyInstaller 的坑（漏 --add-data、漏依赖）只有真打一次才暴露，
  # 而 release 只在打 tag 时才构建——历史上因此发生过"exe 一启动就崩"。
  # 这里在每次 PR/push 就按发布的方式打一遍，并跑 --selftest / --version。
  admin-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: 构建 Rust 产物
        run: cargo build --release --workspace
      - name: 安装管理端依赖（GUI + 打包）
        run: cd admin && uv sync --extra gui --extra build
      - name: 打包并自检
        run: cd admin && uv run python buildtools/build_exe.py
      # Windows 上跑一遍测试。
      #
      # 为什么必须在这个 job 里跑：v0.3.1 的收卷页用了 subprocess.run(text=True)
      # 没指定 encoding，中文 Windows 上按 GBK 解 UTF-8 输出，异常在读取线程里
      # 被吞掉，界面只显示"无输出"。ubuntu 的 python/e2e job 永远绿——只有
      # Windows locale 能暴露这类问题。
      - name: 测试（Windows locale）
        working-directory: admin
        # 只看测试结果，不看进程退出码。
        #
        # 为什么：PySide6 在 Windows 上解释器退出阶段会崩（本机 offscreen 退出码 127、
        # CI 上原生平台退出码 1），但用例本身全部通过。用 junitxml 判定"有没有失败"，
        # 顺带断言用例数没有因为中途崩溃而变少——这比 `|| true` 安全。
        shell: bash
        env:
          # runner 的控制台是 cp1252，打印中文会 UnicodeEncodeError（这次就踩了）
          PYTHONIOENCODING: utf-8
        run: |
          uv run pytest -q --junitxml=pytest-win.xml || echo "pytest 退出码=$?（已知的 Qt 收尾崩溃，以 XML 为准）"
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("pytest-win.xml").getroot()
          cases = list(root.iter("testcase"))
          bad = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          print(f"cases={len(cases)} failures={len(bad)}")
          for c in bad[:10]:
              print("  FAIL", c.get("name"))
          if not cases or bad:
              sys.exit(1)
          PY

  # 端到端：真的打一个包再用学生端解开，防止"单元测试全绿但装不起来"。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 打包并验证
        run: |
          set -euo pipefail
          cargo build --release -p client -p builder
          BIN=./target/release
          MASTER=$("$BIN/exam-builder" keygen 2>/dev/null)

          # 时间窗必须动态生成：写死日期会在日期过后让 e2e 永久失败。
          # 这里造一场"正在进行"的考试 + 一场"尚未开始"的考试。
          NOW_START=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          NOW_END=$(date -u -d '1 hour'     +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_START=$(date -u -d '30 days' +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_END=$(date -u -d '30 days 2 hours' +%Y-%m-%dT%H:%M:%SZ)

          cat > ./live.json <<JSON
          {
            "version": 2,
            "salt": "00112233445566778899aabbccddeeff",
            "sessions": [
              { "session_id": 1, "start": "$NOW_START", "end": "$NOW_END",
                "students": [2021001, 2021002],
                "exams": [{ "file": "demo/math.json", "pick": 3 }] },
              { "session_id": 2, "start": "$FUTURE_START", "end": "$FUTURE_END",
                "students": [2021001],
                "exams": [{ "file": "demo/english.json", "pick": 2 }] }
            ]
          }
          JSON

          "$BIN/exam-builder" build \
            --manifest ./live.json --banks banks/ \
            --stub "$BIN/exam-client" --out ./StudentClient --master "$MASTER"
          "$BIN/exam-builder" verify --package ./StudentClient --master "$MASTER"

          fail() { echo "✗ $1"; exit 1; }

          echo "--- 1) 学号不得出现在包里 ---"
          if grep -aq "2021001" ./StudentClient; then fail "包中出现学号明文"; fi
          echo "  ✓ 无学号明文"

          echo "--- 2) 名单内 + 时间窗内 → 应解锁 ---"
          ./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient \
            | tee /tmp/ok.txt
          grep -q "解锁成功" /tmp/ok.txt || fail "名单内学生未能解锁"
          echo "  ✓ 解锁成功"

          echo "--- 3) 名单外 → 应拒绝 ---"
          if ./StudentClient --student 9999999 --master "$MASTER" --package ./StudentClient; then
            fail "名单外学生竟然解锁成功"
          fi
          echo "  ✓ 正确拒绝"

          echo "--- 4) 【P0-A 回归】--session 指定未来场次 → 必须拒绝 ---"
          if ./StudentClient --student 2021001 --session 2 \
               --master "$MASTER" --package ./StudentClient; then
            fail "显式指定场次绕过了时间门禁"
          fi
          echo "  ✓ 门禁未被 --session 绕过"

          echo "--- 5) 【P0-A 回归】--skip-timegate 在 release 中不存在 ---"
          if ./StudentClient --student 2021001 --skip-timegate \
               --master "$MASTER" --package ./StudentClient 2>/dev/null; then
            fail "release 构建仍接受 --skip-timegate"
          fi
          echo "  ✓ release 无跳过门禁的后门"

          echo "--- 6) 错误主密钥 → 应拒绝 ---"
          WRONG=$(printf 'ab%.0s' $(seq 1 32))
          if ./StudentClient --student 2021001 --master "$WRONG" --package ./StudentClient; then
            fail "错误主密钥竟然能解锁"
          fi
          echo "  ✓ 错误密钥被拒绝"

          echo "--- 7) 确定性：两次运行指纹一致 ---"
          F1=$(./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient | grep 指纹)
          F2=$(./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient | grep 指纹)
          [ "$F1" = "$F2" ] || fail "同一学生两次抽题结果不一致"
          echo "  ✓ $F1"

          echo "✓ e2e 全部通过"

      - name: 密钥嵌入验收
        shell: bash
        run: bash scripts/verify-embed.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: ci

on:
  pull_request:
  push:
    branches: [main]

# 保留 Linux / Windows 回归；AppImage 单独构建并验收真实产物。
jobs:
  rust:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # client 引入了 eframe → winit/glutin，Linux 上需要 X11/Wayland 开发头文件。
      # 即使上游用的是 dlopen 加载方式、实际不链接这些库，装上也无害（约 5 秒），
      # 能消除"CI 因缺系统库变红"的不确定性。
      - name: 安装 Linux GUI 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（含黄金向量：确定性抽题跨平台一致性）
        run: cargo test --workspace

  python:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Qt 的无头运行需要这些系统库：缺 libEGL/libGL 时 QApplication 直接
      # 报 "could not load the Qt platform plugin xcb"。
      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: lint + test
        working-directory: admin
        # uv 会按 pyproject.toml 的 requires-python 自动挑选解释器，
        # 不需要额外的 setup-python。
        #
        # 装 --extra gui 并设 QT_QPA_PLATFORM=offscreen：UI 测试**真的跑**，
        # 不再 importorskip 跳过。本项目最严重的几个 bug（勾选丢失、
        # 保存后科目清空）都只在界面层暴露，跳过等于没测。
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked --extra gui
          uv run ruff check .
          # 格式也必须卡住：release 工作流会跑 format --check，只在这里跑 check
          # 等于把格式问题留到打 tag 才暴露。
          uv run ruff format --check .
          # scripts/ 下的 python（drill_web / bump_version / release_body）是仓库资产，
          # 不在 admin 的 lint 范围里；不在这里检查就永远没人管。
          uv run ruff check ../scripts
          uv run ruff format --check ../scripts
          uv run pytest -q

  # 使用较旧 glibc 基线；无 FUSE 的真实 AppImage 路径也必须在 PR 阶段覆盖。
  linux-appimage:
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: 安装 Linux 桌面与 AppImage 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl ca-certificates zip unzip squashfs-tools fonts-noto-cjk \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1 libgl1 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-keysyms1 libxcb-icccm4 \
            libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: 构建教师、学生 AppImage 与目录式发布包
        run: bash scripts/build-linux.sh --appimage
      - name: AppImage 外层 payload 与时间门禁烟测
        run: admin/.venv/bin/python scripts/smoke-appimage.py
      - name: 教师 AppImage 界面与持久题库自检
        run: |
          IMAGE="dist/ExamAdmin-$(tr -d '[:space:]' < VERSION)-x86_64.AppImage"
          "$IMAGE" --appimage-extract-and-run --dump-ui target/appimage-ui
          admin/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("target/appimage-ui/info.json").read_text(encoding="utf-8"))
          assert data["label_visible"], data
          assert len(data["tabs"]) == 5, data
          assert data["qt_style"] == "fusion", data
          assert data["font_family"] == "Noto Sans CJK SC", data
          assert data["build"]["stub"].endswith("stub-template.AppImage"), data
          assert data["build"]["output"].endswith("StudentClient.AppImage"), data
          assert len(data["banks"]) == 3, data
          assert sum(bank["questions"] for bank in data["banks"]) == 14, data
          # AppImage 进程已经退出，解压目录已清理；此时源文件仍须可读。
          for bank in data["banks"]:
              source = Path(bank["source"])
              saved = json.loads(source.read_text(encoding="utf-8"))
              assert saved["exam_id"] == bank["exam_id"], bank
              assert len(saved["questions"]) == bank["questions"], bank
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exam-admin-linux-appimage
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/ExamAdmin-*-linux.zip
            dist/ExamAdmin-*-x86_64.AppImage
            dist/stub-template-x86_64.AppImage
            target/appimage-ui/info.json

  # 发布预检：复现 release.yml 的关键假设。
  #
  # 为什么需要单独一个 job：release 曾经有三处只有真实发布环境才暴露的问题
  # （产物在 target/<triple>/release、onefile 需要可写 TEMP、脚本输出编码）。
  # 这里用 --target 构建，专门覆盖"CI 布局与产物定位"这一段，
  # 让回归在 PR 阶段就被发现，而不是打 tag 之后。
  release-preflight:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 不装 uv 时 preflight 里的 pytest 步骤会被静默跳过（脚本只打印「跳过」，
      # 不计 ok/bad），日志却仍以「✓ 发布预检通过」收尾——门禁比文档承诺的更弱。
      - uses: astral-sh/setup-uv@v5
      # 装上 GUI extra：否则管理端 UI 用例会被 importorskip 跳过，
      # 这一步就只剩「部分测试通过」。
      - name: 安装管理端依赖（含 GUI）
        run: cd admin && uv sync --locked --extra gui
      - name: 安装 Linux GUI 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: 安装 Qt 运行库
        # 预检第 9 步会真的跑管理端 pytest；装了 PySide6 却没有这些库时，
        # UI 用例在无头环境里起不来（与 python job 同一套依赖）。
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: 按 release 的方式构建（带 --target）
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu
      - name: 发布预检
        run: bash scripts/preflight-release.sh

  # 管理端打包：PyInstaller 的坑（漏 --add-data、漏依赖）只有真打一次才暴露，
  # 而 release 只在打 tag 时才构建——历史上因此发生过"exe 一启动就崩"。
  # 这里在每次 PR/push 就按发布的方式打一遍，并跑 --selftest / --version。
  admin-package:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: 构建 Rust 产物
        run: cargo build --release --workspace
      # Windows 专属测试只在 Windows 上编译（secure_fs 的 4 个 ACL 用例、
      # banner_host_follows_bind_address 等）。ubuntu 的 rust job 永远跑不到它们，
      # 不在这里跑的话，坏了要等打 tag 的 release 才暴露。
      - name: Rust 测试（Windows，含只在该平台编译的用例）
        run: cargo test --workspace
      - name: 安装管理端依赖（GUI + 打包）
        run: cd admin && uv sync --extra gui --extra build
      - name: 打包并自检
        run: cd admin && uv run python buildtools/build_exe.py
      # Windows 上跑一遍测试。
      #
      # 为什么必须在这个 job 里跑：v0.3.1 的收卷页用了 subprocess.run(text=True)
      # 没指定 encoding，中文 Windows 上按 GBK 解 UTF-8 输出，异常在读取线程里
      # 被吞掉，界面只显示"无输出"。ubuntu 的 python/e2e job 永远绿——只有
      # Windows locale 能暴露这类问题。
      - name: 测试（Windows locale）
        working-directory: admin
        # 只看测试结果，不看进程退出码。
        #
        # 为什么：PySide6 在 Windows 上解释器退出阶段会崩（本机 offscreen 退出码 127、
        # CI 上原生平台退出码 1），但用例本身全部通过。用 junitxml 判定"有没有失败"，
        # 顺带断言用例数没有因为中途崩溃而变少——这比 `|| true` 安全。
        shell: bash
        env:
          # runner 的控制台是 cp1252，打印中文会 UnicodeEncodeError（这次就踩了）
          PYTHONIOENCODING: utf-8
        run: |
          uv run pytest -q --junitxml=pytest-win.xml || echo "pytest 退出码=$?（已知的 Qt 收尾崩溃，以 XML 为准）"
          uv run python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("pytest-win.xml").getroot()
          cases = list(root.iter("testcase"))
          bad = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          print(f"cases={len(cases)} failures={len(bad)}")
          for c in bad[:10]:
              print("  FAIL", c.get("name"))
          if not cases or bad:
              sys.exit(1)
          PY

  # 端到端：真的打一个包再用学生端解开，防止"单元测试全绿但装不起来"。
  e2e:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 打包并验证
        run: |
          set -euo pipefail
          cargo build --release -p client -p builder
          BIN=./target/release
          MASTER=$("$BIN/exam-builder" keygen 2>/dev/null)

          # 时间窗必须动态生成：写死日期会在日期过后让 e2e 永久失败。
          # 这里造一场"正在进行"的考试 + 一场"尚未开始"的考试。
          NOW_START=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          NOW_END=$(date -u -d '1 hour'     +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_START=$(date -u -d '30 days' +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_END=$(date -u -d '30 days 2 hours' +%Y-%m-%dT%H:%M:%SZ)

          cat > ./live.json <<JSON
          {
            "version": 2,
            "salt": "00112233445566778899aabbccddeeff",
            "sessions": [
              { "session_id": 1, "start": "$NOW_START", "end": "$NOW_END",
                "students": [2021001, 2021002],
                "exams": [{ "file": "demo/math.json", "pick": 3 }] },
              { "session_id": 2, "start": "$FUTURE_START", "end": "$FUTURE_END",
                "students": [2021001],
                "exams": [{ "file": "demo/english.json", "pick": 2 }] }
            ]
          }
          JSON

          # 主密钥只走环境变量：命令行参数会出现在进程列表里（AGENTS §5）。
          EXAM_MASTER="$MASTER" "$BIN/exam-builder" build \
            --manifest ./live.json --banks banks/ \
            --stub "$BIN/exam-client" --out ./StudentClient
          EXAM_MASTER="$MASTER" "$BIN/exam-builder" verify --package ./StudentClient

          fail() { echo "✗ $1"; exit 1; }

          echo "--- 1) 学号不得出现在包里 ---"
          if grep -aq "2021001" ./StudentClient; then fail "包中出现学号明文"; fi
          echo "  ✓ 无学号明文"

          echo "--- 2) 名单内 + 时间窗内 → 应解锁 ---"
          EXAM_MASTER="$MASTER" ./StudentClient --student 2021001 --package ./StudentClient \
            | tee /tmp/ok.txt
          grep -q "解锁成功" /tmp/ok.txt || fail "名单内学生未能解锁"
          echo "  ✓ 解锁成功"

          echo "--- 3) 名单外 → 应拒绝 ---"
          if EXAM_MASTER="$MASTER" ./StudentClient --student 9999999 --package ./StudentClient; then
            fail "名单外学生竟然解锁成功"
          fi
          echo "  ✓ 正确拒绝"

          echo "--- 4) 【P0-A 回归】--session 指定未来场次 → 必须拒绝 ---"
          if EXAM_MASTER="$MASTER" ./StudentClient --student 2021001 --session 2 \
               --package ./StudentClient; then
            fail "显式指定场次绕过了时间门禁"
          fi
          echo "  ✓ 门禁未被 --session 绕过"

          echo "--- 5) 【P0-A 回归】--skip-timegate 在 release 中不存在 ---"
          if EXAM_MASTER="$MASTER" ./StudentClient --student 2021001 --skip-timegate \
               --package ./StudentClient 2>/dev/null; then
            fail "release 构建仍接受 --skip-timegate"
          fi
          echo "  ✓ release 无跳过门禁的后门"

          echo "--- 6) 错误主密钥 → 应拒绝 ---"
          WRONG=$(printf 'ab%.0s' $(seq 1 32))
          if EXAM_MASTER="$WRONG" ./StudentClient --student 2021001 --package ./StudentClient; then
            fail "错误主密钥竟然能解锁"
          fi
          echo "  ✓ 错误密钥被拒绝"

          echo "--- 7) 确定性：两次运行指纹一致 ---"
          F1=$(EXAM_MASTER="$MASTER" ./StudentClient --student 2021001 --package ./StudentClient | grep 指纹)
          F2=$(EXAM_MASTER="$MASTER" ./StudentClient --student 2021001 --package ./StudentClient | grep 指纹)
          [ "$F1" = "$F2" ] || fail "同一学生两次抽题结果不一致"
          echo "  ✓ $F1"

          echo "✓ e2e 全部通过"

      - name: 密钥嵌入验收
        shell: bash
        run: bash scripts/verify-embed.sh

  secret-scan:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tools-scripts:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 与 admin/uv.lock 的 ruff 版本保持一致，避免"本地绿、CI 红"。
      - name: 安装 ruff
        run: pip install ruff==0.17.1
      # 题库相关的两套脚本都是仓库资产：.agents/skills（流程）与 tools/bank_qc（口径执行）。
      - name: lint tools/bank_qc
        run: ruff check tools/bank_qc
      - name: 格式检查 tools/bank_qc
        run: ruff format --check tools/bank_qc
      # skill 脚本不强制全量风格，但 pyflakes 级错误（未定义名/未用导入）必须为零。
      - name: lint skill 脚本（F 规则）
        run: ruff check --select F .agents/skills/question-bank-qc/scripts
      - name: 编译脚本
        run: |
          python -m compileall -q .agents/skills/question-bank-qc/scripts
          python -m compileall -q tools/bank_qc
      # 行为冒烟：逐个脚本执行顶层代码（run_name 不是 __main__，不会进 main()），
      # 能发现缺依赖、导入期路径错误等 compileall 抓不到的问题。
      - name: skill 脚本导入冒烟
        run: |
          for f in .agents/skills/question-bank-qc/scripts/*.py; do
            # admin_validate.py 依赖管理端 app 包（pydantic 等），本 job 未安装，
            # 由 admin 的 python job 覆盖；其余脚本必须能独立 import。
            case "$f" in *admin_validate.py) echo "  · $f（跳过：依赖管理端）"; continue;; esac
            echo "  · $f"
            python -c "import runpy,sys; runpy.run_path(sys.argv[1], run_name='import_smoke')" "$f"
          done
      - name: bank_qc 冒烟
        run: |
          python tools/bank_qc/verify_bank.py --help > /dev/null
          python tools/bank_qc/score_bank.py --help > /dev/null
          # 演示库按口径应当 FAIL（rc=1）；如果它突然 PASS，说明门禁被放水了。
          if python tools/bank_qc/verify_bank.py banks/demo --no-compile > /tmp/verify.log 2>&1; then
            echo "✗ banks/demo 不应通过门禁"
            tail -5 /tmp/verify.log
            exit 1
          fi
          tail -3 /tmp/verify.log
          grep -q "FAIL" /tmp/verify.log
          python tools/bank_qc/score_bank.py banks/demo > /tmp/score.log 2>&1
          tail -2 /tmp/score.log

  # 网页考试：打包 → 启动 exam-server → 登录/作答/交卷 → 校验 .eea
  web-smoke:
    # 没有超时会一直占着 runner 到默认 6 小时上限，把队列堵死。
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 Linux GUI 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: 构建并冒烟
        run: |
          cargo build --release -p server -p builder -p client
          bash scripts/smoke-web.sh
      # 12 人并发演练：登录 / 作答 / kill -9 后重启恢复 / 并发交卷 / 收卡校验。
      # 规模压到 12 人是为了 CI 时长；本地可用 --students 40 做考场规模演练。
      - name: 并发演练（12 人，含崩溃恢复）
        run: bash scripts/drill-web.sh --students 12

name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR/push 检查全部在 Linux 上跑：私有仓库 Windows 分钟按 2 倍计费，能省则省。
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test（含黄金向量：确定性抽题跨平台一致性）
        run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: lint + test
        working-directory: admin
        # uv 会按 pyproject.toml 的 requires-python 自动挑选解释器，
        # 不需要额外的 setup-python。
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

  # 端到端：真的打一个包再用学生端解开，防止"单元测试全绿但装不起来"。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 打包并验证
        run: |
          set -euo pipefail
          cargo build --release -p client -p builder
          BIN=./target/release
          MASTER=$("$BIN/exam-builder" keygen 2>/dev/null)

          # 时间窗必须动态生成：写死日期会在日期过后让 e2e 永久失败。
          # 这里造一场"正在进行"的考试 + 一场"尚未开始"的考试。
          NOW_START=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          NOW_END=$(date -u -d '1 hour'     +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_START=$(date -u -d '30 days' +%Y-%m-%dT%H:%M:%SZ)
          FUTURE_END=$(date -u -d '30 days 2 hours' +%Y-%m-%dT%H:%M:%SZ)

          cat > ./live.json <<JSON
          {
            "version": 2,
            "salt": "00112233445566778899aabbccddeeff",
            "sessions": [
              { "session_id": 1, "start": "$NOW_START", "end": "$NOW_END",
                "students": [2021001, 2021002],
                "exams": [{ "file": "demo/math.json", "pick": 3 }] },
              { "session_id": 2, "start": "$FUTURE_START", "end": "$FUTURE_END",
                "students": [2021001],
                "exams": [{ "file": "demo/english.json", "pick": 2 }] }
            ]
          }
          JSON

          "$BIN/exam-builder" build \
            --manifest ./live.json --banks banks/ \
            --stub "$BIN/exam-client" --out ./StudentClient --master "$MASTER"
          "$BIN/exam-builder" verify --package ./StudentClient --master "$MASTER"

          fail() { echo "✗ $1"; exit 1; }

          echo "--- 1) 学号不得出现在包里 ---"
          if grep -aq "2021001" ./StudentClient; then fail "包中出现学号明文"; fi
          echo "  ✓ 无学号明文"

          echo "--- 2) 名单内 + 时间窗内 → 应解锁 ---"
          ./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient \
            | tee /tmp/ok.txt
          grep -q "解锁成功" /tmp/ok.txt || fail "名单内学生未能解锁"
          echo "  ✓ 解锁成功"

          echo "--- 3) 名单外 → 应拒绝 ---"
          if ./StudentClient --student 9999999 --master "$MASTER" --package ./StudentClient; then
            fail "名单外学生竟然解锁成功"
          fi
          echo "  ✓ 正确拒绝"

          echo "--- 4) 【P0-A 回归】--session 指定未来场次 → 必须拒绝 ---"
          if ./StudentClient --student 2021001 --session 2 \
               --master "$MASTER" --package ./StudentClient; then
            fail "显式指定场次绕过了时间门禁"
          fi
          echo "  ✓ 门禁未被 --session 绕过"

          echo "--- 5) 【P0-A 回归】--skip-timegate 在 release 中不存在 ---"
          if ./StudentClient --student 2021001 --skip-timegate \
               --master "$MASTER" --package ./StudentClient 2>/dev/null; then
            fail "release 构建仍接受 --skip-timegate"
          fi
          echo "  ✓ release 无跳过门禁的后门"

          echo "--- 6) 错误主密钥 → 应拒绝 ---"
          WRONG=$(printf 'ab%.0s' $(seq 1 32))
          if ./StudentClient --student 2021001 --master "$WRONG" --package ./StudentClient; then
            fail "错误主密钥竟然能解锁"
          fi
          echo "  ✓ 错误密钥被拒绝"

          echo "--- 7) 确定性：两次运行指纹一致 ---"
          F1=$(./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient | grep 指纹)
          F2=$(./StudentClient --student 2021001 --master "$MASTER" --package ./StudentClient | grep 指纹)
          [ "$F1" = "$F2" ] || fail "同一学生两次抽题结果不一致"
          echo "  ✓ $F1"

          echo "✓ e2e 全部通过"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

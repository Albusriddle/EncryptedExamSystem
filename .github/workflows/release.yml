name: release

on:
  push:
    tags: ["v*"]

# 必须显式申请 contents: write。
# 2023 年后新建仓库的 GITHUB_TOKEN 默认只读，不声明的话
# softprops/action-gh-release 会 403，Release 根本不会出现。
permissions:
  contents: write

# 打 tag 才出 Windows 包，节省私有仓库的 Actions 分钟。
#
# 发布三种东西：
#   1. ExamAdmin（管理端图形程序，文件夹形式）—— 教师直接用这个
#   2. exam-builder.exe —— 命令行打包工具（进阶用户）
#   3. stub-template.exe —— 学生端模板，随 ExamAdmin 一起提供
#
# ⚠ stub-template.exe 单独发给学生是**没有用**的：它没有内嵌 payload。
#   必须先由 builder 把 payload（含密钥）打进去，产物才是学生的自解压包。
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 构建（GitHub runner 自带 VS，用 msvc 出正式版）
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc

      - name: 冒烟测试（发布前必须通过）
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-pc-windows-msvc/release
          MASTER=$("$BIN/exam-builder.exe" keygen 2>/dev/null)
          test ${#MASTER} -eq 64 || { echo "✗ keygen 输出长度错误"; exit 1; }
          echo "✓ builder 可运行"

      - name: 端到端冒烟（学生端必须零配置可解锁）
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-pc-windows-msvc/release
          TMP=./_smoke
          mkdir -p "$TMP"
          MASTER=$("$BIN/exam-builder.exe" keygen 2>/dev/null)
          NS=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          NE=$(date -u -d '1 hour'     +%Y-%m-%dT%H:%M:%SZ)
          cat > "$TMP/m.json" <<JSON
          {"version":2,"salt":"00112233445566778899aabbccddeeff",
           "sessions":[{"session_id":1,"start":"$NS","end":"$NE",
           "students":[2021001],"exams":[{"file":"demo/math.json","pick":2}]}]}
          JSON
          export EXAM_MASTER="$MASTER"
          "$BIN/exam-builder.exe" build --manifest "$TMP/m.json" --banks banks/ \
            --stub "$BIN/exam-client.exe" --out "$TMP/S.exe"
          # 关键：不带任何密钥参数，模拟学生双击
          "$TMP/S.exe" --student 2021001 --package "$TMP/S.exe" | grep -q "解锁成功" \
            || { echo "✗ 学生端无法零配置解锁（发布物不可用）"; exit 1; }
          echo "✓ 学生端零配置可解锁"
          rm -rf "$TMP"

      - name: 安装 Python 与 PySide6
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # 必须装管理端自己的依赖（pydantic）。只装 PySide6 的话，
          # PyInstaller 不会报错，但打出的 exe 一启动就 ModuleNotFoundError。
          pip install -e "./admin[gui]" pyinstaller

      - name: 打包管理端（文件夹形式）
        shell: bash
        run: |
          set -euo pipefail
          python admin/buildtools/build_exe.py

      # 复用本地同一个打包脚本，保证 CI 产物与本地演练完全一致
      # （包含 开始这里.md / 使用说明.md / 示例题库 与正确的命名）。
      - name: 生成教师发布包
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/make-release-zip.sh "${GITHUB_REF_NAME}"

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp target/x86_64-pc-windows-msvc/release/exam-builder.exe release/
          cp target/x86_64-pc-windows-msvc/release/exam-client.exe release/stub-template.exe
          cp dist/ExamAdmin-*-windows.zip release/
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: exam-tools-windows
          path: release/

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ExamAdmin-*-windows.zip
            release/exam-builder.exe
            release/stub-template.exe
          body_path: docs/release-notes.md

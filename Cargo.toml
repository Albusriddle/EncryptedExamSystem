[workspace]
resolver = "3"
members = ["crates/common", "crates/builder", "crates/client", "crates/server"]

[workspace.package]
version = "1.5.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
blake3 = "1"
rand = "0.9"
rand_chacha = "0.9"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
argon2 = "0.5"
# 信封生成并行化：每生一次 Argon2id(64MiB)，1000 人串行需 91 秒。
rayon = "1"
ed25519-dalek = { version = "2", features = ["std"] }

# ring 的 C 代码在本机 MSVC 上带 /Z7（调试信息）编译会报 D8050：
# 「无法执行 c1.dll：未能将命令行放入调试记录中」。ring 的 C 代码不需要调试信息，
# 关掉它的 debug 即可让 debug/test 构建也能编过（release 本来就不带 /Z7）。
[profile.dev.package.ring]
debug = false

[profile.test.package.ring]
debug = false

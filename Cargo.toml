[workspace]
resolver = "3"
members = ["crates/common", "crates/builder", "crates/client"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
blake3 = "1"
rand = "0.9"
rand_chacha = "0.9"
zeroize = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
argon2 = "0.5"
# 信封生成并行化：每生一次 Argon2id(64MiB)，1000 人串行需 91 秒。
rayon = "1"

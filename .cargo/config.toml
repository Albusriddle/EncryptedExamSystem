# 本机（已装 VS Build Tools）默认走 MSVC target，无需任何额外配置。
#
# 下面的 GNU 配置只在"没有 VS Build Tools、但有 MinGW"的机器上生效：
#   rustup target add x86_64-pc-windows-gnu
#   cargo build --target x86_64-pc-windows-gnu
#
# 注意：GNU target 仍需要 x86_64-w64-mingw32-gcc 在 PATH 里，否则链接失败。

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

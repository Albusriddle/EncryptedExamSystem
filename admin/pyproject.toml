[project]
name = "exam-admin"
version = "0.12.3"
license = { text = "Apache-2.0" }
description = "保密考试系统管理端"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# 图形界面
gui = ["PySide6>=6.7"]
# 打包成 ExamAdmin.exe（buildtools/build_exe.py 需要）
build = ["pyinstaller>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
